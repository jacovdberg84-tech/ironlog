<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" role="img" aria-label="Track shoe and grouser">
  <rect width="360" height="120" fill="#f8fafc"/>
  <text x="180" y="18" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#0f172a">Track shoe / grouser height</text>
  <rect x="60" y="40" width="240" height="24" rx="2" fill="#64748b" stroke="#334155"/>
  <rect x="80" y="28" width="18" height="12" fill="#475569"/>
  <rect x="110" y="28" width="18" height="12" fill="#475569"/>
  <rect x="140" y="28" width="18" height="12" fill="#475569"/>
  <rect x="170" y="28" width="18" height="12" fill="#475569"/>
  <rect x="200" y="28" width="18" height="12" fill="#475569"/>
  <rect x="230" y="28" width="18" height="12" fill="#475569"/>
