<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Track sag measurement points">
  <rect width="320" height="200" fill="#f8fafc"/>
  <text x="160" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="11" font-weight="700" fill="#0f172a">Track sag - 4-point check (mm)</text>
  <rect x="60" y="50" width="200" height="8" fill="#64748b"/>
  <path d="M 60 58 Q 160 110 260 58" fill="none" stroke="#0b3a7e" stroke-width="2"/>
  <circle cx="90" cy="72" r="14" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <text x="90" y="76" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">A</text>
  <circle cx="230" cy="72" r="14" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <text x="230" y="76" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">B</text>
  <circle cx="90" cy="118" r="14" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <text x="90" y="122" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">C</text>
  <circle cx="230" cy="118" r="14" fill="#22c55e" stroke="#fff" stroke-width="2"/>
  <text x="230" y="122" text-anchor="middle" font-size="12" fill="#fff" font-weight="700">D</text>
  <text x="160" y="165" text-anchor="middle" font-size="9" fill="#64748b">A/B = upper track - C/D = lower span</text>
  <text x="160" y="182" text-anchor="middle" font-size="8" fill="#64748b">Record sag distance at each point in mm</text>
</svg>
