<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" role="img" aria-label="Track roller positions 1 to 12">
  <rect width="520" height="220" fill="#f8fafc"/>
  <text x="260" y="20" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#0f172a">Track rollers  side view (1 = front ’ 12 = rear)</text>
  <!-- LH rail -->
  <line x1="60" y1="50" x2="460" y2="50" stroke="#475569" stroke-width="3"/>
  <line x1="60" y1="130" x2="460" y2="130" stroke="#475569" stroke-width="3"/>
  <text x="30" y="95" font-size="10" fill="#0b3a7e" font-weight="700" transform="rotate(-90 30 95)">LH</text>
  <!-- RH rail -->
  <line x1="60" y1="155" x2="460" y2="155" stroke="#475569" stroke-width="3"/>
  <line x1="60" y1="195" x2="460" y2="195" stroke="#475569" stroke-width="3"/>
  <text x="30" y="178" font-size="10" fill="#0b3a7e" font-weight="700" transform="rotate(-90 30 178)">RH</text>
  <!-- Rollers 1-12 on LH (top track) -->
  <g font-family="Arial,sans-serif" font-size="9" font-weight="700">
    <circle cx="72" cy="90" r="11" fill="#64748b"/><text x="72" y="94" text-anchor="middle" fill="#fff">1</text>
    <circle cx="105" cy="90" r="11" fill="#64748b"/><text x="105" y="94" text-anchor="middle" fill="#fff">2</text>
    <circle cx="138" cy="90" r="11" fill="#64748b"/><text x="138" y="94" text-anchor="middle" fill="#fff">3</text>
    <circle cx="171" cy="90" r="11" fill="#64748b"/><text x="171" y="94" text-anchor="middle" fill="#fff">4</text>
    <circle cx="204" cy="90" r="11" fill="#64748b"/><text x="204" y="94" text-anchor="middle" fill="#fff">5</text>
    <circle cx="237" cy="90" r="11" fill="#64748b"/><text x="237" y="94" text-anchor="middle" fill="#fff">6</text>
    <circle cx="270" cy="90" r="11" fill="#64748b"/><text x="270" y="94" text-anchor="middle" fill="#fff">7</text>
    <circle cx="303" cy="90" r="11" fill="#64748b"/><text x="303" y="94" text-anchor="middle" fill="#fff">8</text>
    <circle cx="336" cy="90" r="11" fill="#64748b"/><text x="336" y="94" text-anchor="middle" fill="#fff">9</text>
    <circle cx="369" cy="90" r="11" fill="#64748b"/><text x="369" y="94" text-anchor="middle" fill="#fff">10</text>
    <circle cx="402" cy="90" r="11" fill="#64748b"/><text x="402" y="94" text-anchor="middle" fill="#fff">11</text>
    <circle cx="435" cy="90" r="11" fill="#64748b"/><text x="435" y="94" text-anchor="middle" fill="#fff">12</text>
    <!-- RH bottom track same numbers -->
    <circle cx="72" cy="175" r="11" fill="#64748b"/><text x="72" y="179" text-anchor="middle" fill="#fff">1</text>
    <circle cx="105" cy="175" r="11" fill="#64748b"/><text x="105" y="179" text-anchor="middle" fill="#fff">2</text>
    <circle cx="138" cy="175" r="11" fill="#64748b"/><text x="138" y="179" text-anchor="middle" fill="#fff">3</text>
    <circle cx="171" cy="175" r="11" fill="#64748b"/><text x="171" y="179" text-anchor="middle" fill="#fff">4</text>
    <circle cx="204" cy="175" r="11" fill="#64748b"/><text x="204" y="179" text-anchor="middle" fill="#fff">5</text>
    <circle cx="237" cy="175" r="11" fill="#64748b"/><text x="237" y="179" text-anchor="middle" fill="#fff">6</text>
    <circle cx="270" cy="175" r="11" fill="#64748b"/><text x="270" y="179" text-anchor="middle" fill="#fff">7</text>
    <circle cx="303" cy="175" r="11" fill="#64748b"/><text x="303" y="179" text-anchor="middle" fill="#fff">8</text>
    <circle cx="336" cy="175" r="11" fill="#64748b"/><text x="336" y="179" text-anchor="middle" fill="#fff">9</text>
    <circle cx="369" cy="175" r="11" fill="#64748b"/><text x="369" y="179" text-anchor="middle" fill="#fff">10</text>
    <circle cx="402" cy="175" r="11" fill="#64748b"/><text x="402" y="179" text-anchor="middle" fill="#fff">11</text>
    <circle cx="435" cy="175" r="11" fill="#64748b"/><text x="435" y="179" text-anchor="middle" fill="#fff">12</text>
  </g>
  <text x="260" y="212" text-anchor="middle" font-size="9" fill="#64748b">Measure each roller  match number to form row</text>
</svg>
