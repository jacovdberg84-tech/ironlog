<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IRONLOG LDV Pre-Start</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #151a22;
      --line: #253044;
      --text: #e7edf5;
      --muted: #97a2b3;
      --accent: #2563eb;
      --ok: #16a34a;
      --bad: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .muted {
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .kv {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .kv .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .kv .v {
      font-weight: 700;
      font-size: 15px;
    }
    .row {
      margin: 10px 0;
    }
    .row label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f172a;
      color: var(--text);
      padding: 10px;
      font-size: 15px;
    }
    textarea { min-height: 78px; resize: vertical; }
    .check {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.2);
    }
    .check input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 1px 0 0 0;
      flex: 0 0 18px;
      accent-color: var(--accent);
    }
    .check label {
      margin: 0;
      color: var(--text);
      font-size: 14px;
      line-height: 1.35;
      display: inline-block;
      cursor: pointer;
    }
    .check:last-child { border-bottom: 0; }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button, a.btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      background: #1a2333;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .msg {
      margin-top: 8px;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }
    .msg.ok {
      background: rgba(22, 163, 74, 0.15);
      border-color: rgba(22, 163, 74, 0.55);
      color: #bbf7d0;
    }
    .msg.warn {
      background: rgba(217, 119, 6, 0.2);
      border-color: rgba(217, 119, 6, 0.65);
      color: #fde68a;
    }
    .msg.err {
      background: rgba(220, 38, 38, 0.18);
      border-color: rgba(220, 38, 38, 0.6);
      color: #fecaca;
    }
    .sync {
      margin-top: 8px;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(22, 163, 74, 0.45);
      background: rgba(22, 163, 74, 0.12);
      color: #bbf7d0;
      display: none;
    }
    .tiny {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
  <link rel="stylesheet" href="/web/prestart-form.css?v=2" />
</head>
<body>
  <div class="wrap">
    <div class="card pc-hero">
      <div>
        <h1 id="assetCode">Loading…</h1>
        <div class="pc-asset-name" id="assetName"></div>
        <div class="pc-title" data-i18n="vehiclePrestart">Vehicle pre-start</div>
      </div>
      <div class="pc-hero-side"><div class="pc-lang" role="group" aria-label="Language / Idioma"><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="pt" aria-pressed="false">PT</button></div><div class="pc-date"><span data-i18n="date">Date</span><br /><strong id="checkDate">-</strong></div></div>
    </div>

    <div id="formArea">
      <div class="card">
        <div class="pc-fields">
          <div>
            <label for="inspectorName" data-i18n="yourName">Your name</label>
            <input id="inspectorName" type="text" autocomplete="name" data-i18n-ph="driverPh" placeholder="Driver name" />
          </div>
          <div>
            <label for="odometerKm" data-i18n="odometer">Odometer (km) *</label>
            <input id="odometerKm" type="number" inputmode="decimal" step="0.1" min="0" data-i18n-ph="odometerPh" placeholder="From the dashboard" />
            <div class="tiny"><span data-i18n="lastReading">Last reading</span>: <span id="prevKm">-</span></div>
          </div>
        </div>
      </div>

      <div class="card">
        <div id="sub" class="muted" style="margin-bottom:10px;">Loading…</div>
        <div id="checklistRoot"></div>
      </div>

      <div class="card">
        <details class="pc-more">
          <summary data-i18n="addNote">Add a note or photo (optional)</summary>
          <div class="row">
            <label for="notes" data-i18n="note">Note</label>
            <textarea id="notes" data-i18n-ph="notePh" placeholder="Anything the workshop should know"></textarea>
          </div>
          <div class="row">
            <label for="photoInput" data-i18n="photo">Photo</label>
            <input id="photoInput" type="file" accept="image/*" capture="environment" />
            <div class="tiny" data-i18n="photoHint">The photo is attached when you submit.</div>
          </div>
        </details>
      </div>

      <div id="msg"></div>

      <div class="pc-footer">
        <div class="pc-progress" id="pcProgress">0 of 0 checked</div>
        <button class="primary" id="saveBtn" type="button">Submit pre-start</button>
      </div>
    </div>

    <div id="doneArea" class="card pc-done" hidden>
      <div class="pc-done-mark" id="doneMark">✓</div>
      <h2 id="doneTitle">Pre-start done</h2>
      <p id="doneText" class="muted"></p>
      <div id="syncState" class="sync"></div>
      <div class="pc-links">
        <a id="openPdfBtn" href="#" hidden data-i18n="openPdf">Open check PDF</a>
        <button type="button" id="editAgainBtn" data-i18n="changeAnswers">Change answers</button>
      </div>
    </div>

    <div class="pc-links">
      <span id="offlineState" class="muted"></span>
      <a id="openQrBtn" href="#" data-i18n="vehicleDetails">Vehicle details</a>
      <button id="refreshBtn" type="button" data-i18n="reload">Reload</button>
    </div>
  </div>
  <script src="/web/prestart-form.js?v=2"></script>
  <script src="/web/ldv-prestart.js?v=6"></script>
</body>
</html>
