<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IRONLOG LDV Pre-Start</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --panel: #151a22;
      --line: #253044;
      --text: #e7edf5;
      --muted: #97a2b3;
      --accent: #2563eb;
      --ok: #16a34a;
      --bad: #dc2626;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    .wrap {
      max-width: 720px;
      margin: 0 auto;
      padding: 16px;
    }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 24px;
    }
    .muted {
      color: var(--muted);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
    }
    .kv {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
    }
    .kv .k {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 4px;
    }
    .kv .v {
      font-weight: 700;
      font-size: 15px;
    }
    .row {
      margin: 10px 0;
    }
    .row label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: var(--muted);
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #0f172a;
      color: var(--text);
      padding: 10px;
      font-size: 15px;
    }
    textarea { min-height: 78px; resize: vertical; }
    .check {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px dashed rgba(148, 163, 184, 0.2);
    }
    .check:last-child { border-bottom: 0; }
    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }
    button, a.btn {
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 14px;
      background: #1a2333;
      color: var(--text);
      text-decoration: none;
      cursor: pointer;
      font-size: 14px;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 700;
    }
    .msg {
      margin-top: 8px;
      font-size: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
    }
    .msg.ok {
      background: rgba(22, 163, 74, 0.15);
      border-color: rgba(22, 163, 74, 0.55);
      color: #bbf7d0;
    }
    .msg.err {
      background: rgba(220, 38, 38, 0.18);
      border-color: rgba(220, 38, 38, 0.6);
      color: #fecaca;
    }
    .sync {
      margin-top: 8px;
      font-size: 13px;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(22, 163, 74, 0.45);
      background: rgba(22, 163, 74, 0.12);
      color: #bbf7d0;
      display: none;
    }
    .tiny {
      font-size: 12px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>LDV Pre-Start Checklist</h1>
      <div id="sub" class="muted">Loading...</div>
      <div class="actions">
        <a class="btn" id="openQrBtn" href="#">Asset QR</a>
        <button id="refreshBtn" type="button">Refresh</button>
      </div>
    </div>

    <div class="card">
      <div class="grid">
        <div class="kv"><div class="k">Vehicle</div><div class="v" id="assetCode">-</div></div>
        <div class="kv"><div class="k">Name</div><div class="v" id="assetName">-</div></div>
        <div class="kv"><div class="k">Date</div><div class="v" id="checkDate">-</div></div>
        <div class="kv"><div class="k">Previous KM</div><div class="v" id="prevKm">-</div></div>
      </div>
    </div>

    <div class="card">
      <div class="row">
        <label for="odometerKm">Current Odometer (KM) *</label>
        <input id="odometerKm" type="number" step="0.1" min="0" placeholder="Enter current KM from dashboard" />
      </div>
      <div class="row">
        <label for="inspectorName">Inspector / Driver</label>
        <input id="inspectorName" type="text" placeholder="Your name" />
      </div>
      <div class="row">
        <label>Pre-Start Checks (all required)</label>
        <div class="check"><input id="chkBrakes" type="checkbox" /> <label for="chkBrakes">Brakes OK</label></div>
        <div class="check"><input id="chkLights" type="checkbox" /> <label for="chkLights">Lights OK</label></div>
        <div class="check"><input id="chkTyres" type="checkbox" /> <label for="chkTyres">Tyres OK</label></div>
        <div class="check"><input id="chkOilCoolant" type="checkbox" /> <label for="chkOilCoolant">Oil/Coolant OK</label></div>
        <div class="check"><input id="chkLeaks" type="checkbox" /> <label for="chkLeaks">No leaks or visible damage</label></div>
        <div class="check"><input id="chkSafety" type="checkbox" /> <label for="chkSafety">Safety items in place</label></div>
      </div>
      <div class="row">
        <label for="notes">Notes</label>
        <textarea id="notes" placeholder="Any remarks before start"></textarea>
      </div>
      <div class="actions">
        <button class="primary" id="saveBtn" type="button">Submit Pre-Start</button>
        <a class="btn" id="openPdfBtn" href="#" style="display:none;">Open Check PDF</a>
      </div>
      <div class="row">
        <label for="photoInput">Photo (optional)</label>
        <input id="photoInput" type="file" accept="image/*" capture="environment" />
        <div class="actions" style="margin-top:8px;">
          <button id="uploadPhotoBtn" type="button">Upload Photo</button>
        </div>
        <div class="tiny">Tip: submit pre-start first, then upload photo.</div>
      </div>
      <div id="syncState" class="sync"></div>
      <div id="msg"></div>
    </div>
  </div>
  <script src="/web/ldv-prestart.js?v=1"></script>
</body>
</html>
