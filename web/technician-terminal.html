<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>IRONLOG Technician Portal</title>
  <link rel="manifest" href="./tech-manifest.json" />
  <script>
    (function () {
      try {
        if (localStorage.getItem("ironlog-theme") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="./technician-terminal.css?v=3" />
  <link rel="stylesheet" href="./tech-portal.css?v=5" />
</head>
<body>
  <div id="loginScreen" class="screen">
    <div class="shell shell-wide">
      <div class="brand-block">
        <div class="brand-mark">IL</div>
        <h1 data-t="Technician Portal">Technician Portal</h1>
        <p class="muted" data-t="Tap your name, then enter your PIN">Tap your name, then enter your PIN</p>
        <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button></div>
      </div>

      <div id="pinLoginPanel" class="card">
        <div id="pinRoster" class="pin-roster">
          <div class="muted small" data-t="Loading technicians…">Loading technicians…</div>
        </div>
        <div id="pinSelectedUser" class="pin-selected muted small hidden">Select your name above</div>
        <div class="pin-display" id="pinDisplay" aria-live="polite">····</div>
        <div class="pin-pad" id="pinPad">
          <button type="button" class="pin-key" data-digit="1">1</button>
          <button type="button" class="pin-key" data-digit="2">2</button>
          <button type="button" class="pin-key" data-digit="3">3</button>
          <button type="button" class="pin-key" data-digit="4">4</button>
          <button type="button" class="pin-key" data-digit="5">5</button>
          <button type="button" class="pin-key" data-digit="6">6</button>
          <button type="button" class="pin-key" data-digit="7">7</button>
          <button type="button" class="pin-key" data-digit="8">8</button>
          <button type="button" class="pin-key" data-digit="9">9</button>
          <button type="button" class="pin-key pin-key-muted" id="pinClearBtn" data-t="Clear">Clear</button>
          <button type="button" class="pin-key" data-digit="0">0</button>
          <button type="button" class="pin-key pin-key-muted" id="pinBackBtn">⌫</button>
        </div>
        <button type="button" id="pinSubmitBtn" class="btn primary full" disabled data-t="Sign in with PIN">Sign in with PIN</button>
        <div id="pinLoginError" class="error"></div>
      </div>

      <div class="login-toggle-row">
        <button type="button" id="showPasswordLoginBtn" class="btn ghost sm" data-t="Use username &amp; password">Use username &amp; password</button>
      </div>

      <div id="passwordLoginPanel" class="card hidden">
        <label class="field">
          <span data-t="Username">Username</span>
          <input id="loginUsername" type="text" autocomplete="username" placeholder="e.g. jsmith" />
        </label>
        <label class="field">
          <span data-t="Password">Password</span>
          <input id="loginPassword" type="password" autocomplete="current-password" placeholder="Your password" />
        </label>
        <label class="chk">
          <input id="loginRemember" type="checkbox" checked />
          <span data-t="Remember this device">Remember this device</span>
        </label>
        <button type="button" id="loginBtn" class="btn primary full" data-t="Sign in">Sign in</button>
        <div id="loginError" class="error"></div>
        <button type="button" id="showPinLoginBtn" class="btn ghost sm full" style="margin-top:10px;" data-t="← Back to PIN">← Back to PIN</button>
      </div>

      <p class="foot muted" data-t="Supervisors set PINs in User Admin. PIN is 4–6 digits.">Supervisors set PINs in User Admin. PIN is 4–6 digits.</p>
    </div>
  </div>

  <div id="appScreen" class="screen hidden">
    <header class="top">
      <div>
        <div class="top-title" data-t="Technician portal">Technician portal</div>
        <div id="sessionLabel" class="top-sub muted">—</div>
      </div>
      <div class="top-actions">
        <div class="lang-switch" role="group" aria-label="Language"><button type="button" data-lang="en">EN</button><button type="button" data-lang="pt">PT</button></div>
        <button type="button" id="refreshJobsBtn" class="btn ghost sm" title="Refresh">↻</button>
        <button type="button" id="logoutBtn" class="btn ghost sm" data-t="Sign out">Sign out</button>
      </div>
    </header>

    <div id="tpApp">
      <div id="tpSync" class="tp-sync hidden"></div>
      <main id="tpMain" class="tp-main"></main>
      <div id="tpSheet" class="tp-sheet hidden"></div>
      <div id="tpToast" class="tp-toast"></div>
      <nav class="tp-tabs">
        <button type="button" class="tp-tab" data-go="today"><span>▦</span><b data-t="Today">Today</b></button>
        <button type="button" class="tp-tab" data-go="shift"><span>◷</span><b data-t="Shift">Shift</b></button>
        <button type="button" class="tp-tab" data-go="week"><span>▤</span><b data-t="Week">Week</b></button>
        <button type="button" class="tp-tab" data-go="scan"><span>⌗</span><b data-t="Machine">Machine</b></button>
      </nav>
    </div>

  </div>

  <script src="./auth-shared.js?v=5"></script>
  <script src="./tech-portal-pt.js?v=4"></script>
  <script src="./tech-portal.js?v=5"></script>
  <script src="./technician-terminal.js?v=7"></script>
</body>
</html>
