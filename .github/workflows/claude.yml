name: Claude (IronLog developer)

# Requests from IronLog's Developer tab arrive as issues that mention @claude.
# Claude works on a branch named claude/issue-<number>-..., and IronLog opens
# the pull request for review. Replies (@claude ...) on the issue or the pull
# request send Claude back to work. Only people with write access can trigger it.
#
# Repository secrets (Settings → Secrets and variables → Actions), set ONE of:
#   CLAUDE_CODE_OAUTH_TOKEN  uses your Claude subscription (run `claude setup-token`)
#   ANTHROPIC_API_KEY        pay-as-you-go key from the Anthropic Console
# Optional repository variables to change models: CLAUDE_OPUS_MODEL, CLAUDE_SONNET_MODEL.

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # Claude runs the API tests before it finishes, so install them first.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # The request picks the model with a label: model:sonnet, otherwise Opus.
          claude_args: |
            --model ${{ (contains(github.event.issue.labels.*.name, 'model:sonnet') || contains(github.event.pull_request.labels.*.name, 'model:sonnet')) && (vars.CLAUDE_SONNET_MODEL || 'claude-sonnet-5-5') || (vars.CLAUDE_OPUS_MODEL || 'claude-opus-5-5') }}
            --allowedTools "Bash(cd:*),Bash(npm test:*),Bash(npm ci:*),Bash(node --test:*),Bash(node --check:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*)"
