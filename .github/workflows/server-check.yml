name: Server check (read-only)

# Prints how the live server is set up (web server, certificates, running
# IronLog processes, disk, ports) so customer instances can be added safely.
# Changes nothing. Run it by hand from the Actions tab.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect the server over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            echo "== system"; uname -sr; uptime; nproc; free -h | head -2
            echo "== disk"; df -h / /data 2>/dev/null
            echo "-- all disks and volumes"; df -hT -x tmpfs -x devtmpfs -x overlay -x squashfs 2>/dev/null
            lsblk -o NAME,SIZE,FSTYPE,MOUNTPOINT 2>/dev/null
            echo "-- volume mounts in fstab"; grep -E 'HC_Volume|/mnt/' /etc/fstab 2>/dev/null || echo "none"
            echo "== node and pm2"; node -v; pm2 -v; pm2 ls --no-color 2>/dev/null || true
            echo "== listening ports"; (ss -ltn 2>/dev/null || netstat -ltn 2>/dev/null) | awk 'NR==1 || /LISTEN/' | head -30
            echo "== web server"
            for b in nginx caddy apache2 httpd; do command -v "$b" >/dev/null 2>&1 && echo "found: $b"; done
            nginx -v 2>&1 || true
            for d in /etc/nginx/sites-enabled /etc/nginx/conf.d; do
              [ -d "$d" ] || continue
              echo "-- $d"; ls -l "$d"
              grep -HnE '^\s*(server_name|listen|proxy_pass|root)\b' "$d"/* 2>/dev/null || true
            done
            echo "== certificates"; command -v certbot && (sudo -n certbot certificates 2>/dev/null || certbot certificates 2>/dev/null) | grep -E 'Certificate Name|Domains|Expiry' || echo "certbot not found or not permitted"
            echo "== ironlog folders"; ls -la /data 2>/dev/null
            echo "== what uses the disk (largest folders)"
            du -xh --max-depth=1 / 2>/dev/null | sort -rh | head -12
            du -xh --max-depth=2 /data /root /home /var /usr/share/ollama 2>/dev/null | sort -rh | head -25
            echo "-- database backups on this server"
            for d in /data/ironlog/api/db/backups /data/ironlog/api/backups /data/backups; do
              [ -d "$d" ] || continue
              echo "$d: $(find "$d" -maxdepth 1 -type f | wc -l) files, $(du -sh "$d" | cut -f1)"
              ls -t "$d" | head -2; echo "..."; ls -t "$d" | tail -2
            done
            echo "-- pm2 logs"; du -sh ~/.pm2/logs 2>/dev/null
            echo "-- ollama models"; du -sh /usr/share/ollama/.ollama/models ~/.ollama/models 2>/dev/null
            echo "-- journal"; journalctl --disk-usage 2>/dev/null || true
            echo "== whoami"; whoami; id -nG
