name: Deploy API to Server

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      JUNE_OUTLOOK_CLIENT_ID: ${{ secrets.JUNE_OUTLOOK_CLIENT_ID }}
      JUNE_OUTLOOK_CLIENT_SECRET: ${{ secrets.JUNE_OUTLOOK_CLIENT_SECRET }}
      JUNE_OUTLOOK_TENANT_ID: ${{ secrets.JUNE_OUTLOOK_TENANT_ID }}
      LEMONSLICE_API_KEY: ${{ secrets.LEMONSLICE_API_KEY }}
      LIVEKIT_URL: ${{ secrets.LIVEKIT_URL }}
      LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
      LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          passphrase: ${{ secrets.SERVER_SSH_PASSPHRASE }}
          port: ${{ secrets.SERVER_PORT }}
          # appleboy/ssh-action only forwards named workflow variables to the
          # remote shell. Without this, the private Actions secret never reaches
          # api/.env and Borris silently uses its deterministic fallback.
          envs: OPENAI_API_KEY,JUNE_OUTLOOK_CLIENT_ID,JUNE_OUTLOOK_CLIENT_SECRET,JUNE_OUTLOOK_TENANT_ID,LEMONSLICE_API_KEY,LIVEKIT_URL,LIVEKIT_API_KEY,LIVEKIT_API_SECRET
          script_stop: true
          script: |
            set -e
            cd /data/ironlog
            if [ -n "$(git status --porcelain)" ]; then
              git stash push --include-untracked -m "autodeploy-$(date +%Y%m%d-%H%M%S)" || true
              git stash list | head -n 1 || true
            fi
            git fetch origin
            git checkout main
            git pull --ff-only origin main
            # This server-only key protects June's Outlook tokens and private
            # ICS links. Generate it once; never rotate it during a normal
            # deployment or existing encrypted connections would be lost.
            env_file="/data/ironlog/api/.env"
            touch "$env_file"
            chmod 600 "$env_file"
            if ! grep -q -E '^JUNE_CONNECTOR_ENCRYPTION_SECRET=.{32,}$' "$env_file"; then
              june_connector_secret="$(openssl rand -base64 48 | tr -d '\n')"
              printf '\nJUNE_CONNECTOR_ENCRYPTION_SECRET=%s\n' "$june_connector_secret" >> "$env_file"
              chmod 600 "$env_file"
            fi
            # Keep the same secret in a root-owned local file as a resilient
            # fallback for PM2 installations that do not reload api/.env.
            # Never replace an existing file: it may protect live connectors.
            june_key_file="/data/ironlog/api/.june-connector.key"
            if [ ! -s "$june_key_file" ]; then
              umask 077
              june_connector_secret="$(sed -n 's/^JUNE_CONNECTOR_ENCRYPTION_SECRET=//p' "$env_file" | head -n 1)"
              printf '%s\n' "$june_connector_secret" > "$june_key_file"
              chmod 600 "$june_key_file"
            fi
            if [ -n "${OPENAI_API_KEY:-}" ]; then
              env_file="/data/ironlog/api/.env"
              touch "$env_file"
              chmod 600 "$env_file"
              env_tmp="$(mktemp)"
              grep -v -E '^(OPENAI_API_KEY|BORRIS_USE_OPENAI_RESPONSES|BORRIS_OPENAI_MODEL|JUNE_BACKEND_MODEL)=' "$env_file" > "$env_tmp" || true
              printf '\nOPENAI_API_KEY=%s\nBORRIS_USE_OPENAI_RESPONSES=1\nBORRIS_OPENAI_MODEL=gpt-4o-mini\nJUNE_BACKEND_MODEL=gpt-5.6-terra\n' "$OPENAI_API_KEY" >> "$env_tmp"
              mv "$env_tmp" "$env_file"
              chmod 600 "$env_file"
            fi
            # Outlook is optional. Only replace these settings when every
            # required secret is present, so an ordinary application deploy
            # cannot accidentally disconnect June's existing mailbox access.
            if [ -n "${JUNE_OUTLOOK_CLIENT_ID:-}" ] && [ -n "${JUNE_OUTLOOK_CLIENT_SECRET:-}" ] && [ -n "${JUNE_OUTLOOK_TENANT_ID:-}" ]; then
              env_file="/data/ironlog/api/.env"
              touch "$env_file"
              chmod 600 "$env_file"
              env_tmp="$(mktemp)"
              grep -v -E '^(JUNE_OUTLOOK_CLIENT_ID|JUNE_OUTLOOK_CLIENT_SECRET|JUNE_OUTLOOK_TENANT_ID|JUNE_OUTLOOK_REDIRECT_URI)=' "$env_file" > "$env_tmp" || true
              printf '\nJUNE_OUTLOOK_CLIENT_ID=%s\nJUNE_OUTLOOK_CLIENT_SECRET=%s\nJUNE_OUTLOOK_TENANT_ID=%s\nJUNE_OUTLOOK_REDIRECT_URI=https://ironlog.ironlogafrica.com/api/june/outlook/callback\n' "$JUNE_OUTLOOK_CLIENT_ID" "$JUNE_OUTLOOK_CLIENT_SECRET" "$JUNE_OUTLOOK_TENANT_ID" >> "$env_tmp"
              mv "$env_tmp" "$env_file"
              chmod 600 "$env_file"
            fi
            # June's LemonSlice visual is optional. Only replace this complete
            # group when every required secret is supplied, so a standard app
            # deployment never disables an already-working avatar connection.
            if [ -n "${LEMONSLICE_API_KEY:-}" ] && [ -n "${LIVEKIT_URL:-}" ] && [ -n "${LIVEKIT_API_KEY:-}" ] && [ -n "${LIVEKIT_API_SECRET:-}" ]; then
              env_file="/data/ironlog/api/.env"
              touch "$env_file"
              chmod 600 "$env_file"
              env_tmp="$(mktemp)"
              grep -v -E '^(LEMONSLICE_API_KEY|LIVEKIT_URL|LIVEKIT_API_KEY|LIVEKIT_API_SECRET)=' "$env_file" > "$env_tmp" || true
              printf '\nLEMONSLICE_API_KEY=%s\nLIVEKIT_URL=%s\nLIVEKIT_API_KEY=%s\nLIVEKIT_API_SECRET=%s\n' "$LEMONSLICE_API_KEY" "$LIVEKIT_URL" "$LIVEKIT_API_KEY" "$LIVEKIT_API_SECRET" >> "$env_tmp"
              mv "$env_tmp" "$env_file"
              chmod 600 "$env_file"
            fi
            cd api
            npm ci
            pm2 restart ironlog-api --update-env
            pm2 save
            for i in 1 2 3 4 5 6; do
              if curl -fsS "http://127.0.0.1:3001/health" > /dev/null; then
                echo "Health check passed."
                exit 0
              fi
              echo "Health check not ready (attempt $i/6), retrying..."
              sleep 5
            done
            echo "Health check failed after restart."
            exit 1
