openapi: 3.0.3
info:
  title: ISO15143 (AEMP 2.0)
  description: |
    Provides a snapshot view of a fleet/Equipment or a time-series data view of an individual piece of equipment.
  termsOfService: https://www.caterpillar.com/en/legal-notices/terms.html
  version: 1.2.0
  contact:
    name: Omega
    email: omegagroup@cat.com
  x-cat-confidential-level-oas: 'Caterpillar: Confidential Yellow'
servers:
- url: https://api.cat.com/telematics/iso15143
security:
- catFedLogin: []
- b2cLogin: []
- entraId: []
externalDocs:
  description: ISO Specification.
  url: https://www.iso.org/standard/76394.html
tags:
- name: Snapshot
  description: |
    Provide a snapshot view of a fleet or an individual piece of equipment.
- name: Time Series
  description: |
    TimeSeries endpoints provides a view into telematics data like Fault Code,
    Switch Status, Engine Condition, Last known Location, Operating Hours,
    Idle Operating Hours, Cumulative Fuel Used and Fuel Remaining Ratio
    for a single construction machine over the specified time.
paths:
  /fleet/{pageNumber}:
    get:
      x-cat-confidential-level-data: 'Caterpillar: Confidential Yellow'
      x-cat-entitlements-enforced: true
      tags:
      - Snapshot
      summary: Fleet Snapshot
      description: Retrieves snapshot view of the fleet.
      operationId: getFleetSnapshot
      parameters:
      - $ref: '#/components/parameters/X-Cat-API-Tracking-Id'
      - $ref: '#/components/parameters/pageNumber'
      responses:
        '200':
          $ref: '#/components/responses/GetFleetSnapshotResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406RequestNotAcceptable'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /fleet/equipment/makeModelSerial/{make}/{model}/{serialNumber}:
    get:
      x-cat-confidential-level-data: 'Caterpillar: Confidential Yellow'
      x-cat-entitlements-enforced: true
      tags:
      - Snapshot
      summary: Equipment Snapshot
      description: |
        Retrieves the snapshot view of the fleet,
        but is limited to a single piece of equipment.
      operationId: getEquipmentSnapshot
      parameters:
      - $ref: '#/components/parameters/X-Cat-API-Tracking-Id'
      - $ref: '#/components/parameters/make'
      - $ref: '#/components/parameters/model'
      - $ref: '#/components/parameters/serialNumber'
      responses:
        '200':
          $ref: '#/components/responses/GetEquipmentSnapshotResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406RequestNotAcceptable'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /fleet/equipment/makeModelSerial/{make}/{model}/{serialNumber}/faults/{startDateUTC}/{endDateUTC}/{pageNumber}:
    get:
      x-cat-confidential-level-data: 'Caterpillar: Confidential Yellow'
      x-cat-entitlements-enforced: true
      tags:
      - Time Series
      summary: Time Series Fault Code
      description: |
        Returns the fault code details along with the recorded time for the given asset within the specified time range (UTC) up to the last 14 days.
      operationId: getTimeseriesFaultCode
      parameters:
      - $ref: '#/components/parameters/X-Cat-API-Tracking-Id'
      - $ref: '#/components/parameters/make'
      - $ref: '#/components/parameters/model'
      - $ref: '#/components/parameters/serialNumber'
      - $ref: '#/components/parameters/startDateUTC'
      - $ref: '#/components/parameters/endDateUTC'
      - $ref: '#/components/parameters/pageNumber'
      responses:
        '200':
          $ref: '#/components/responses/GetTimeSeriesFaultCodeResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406RequestNotAcceptable'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /fleet/equipment/makeModelSerial/{make}/{model}/{serialNumber}/switchStatus/{startDateUTC}/{endDateUTC}/{pageNumber}:
    get:
      tags:
      - Time Series
      x-cat-confidential-level-data: 'Caterpillar: Confidential Yellow'
      x-cat-entitlements-enforced: true
      summary: Get Asset SwitchStatus
      description: |
        Endpoint returns the switch status details in addition to the recorded time(UTC) of a
        given asset and the time range. The data can be requested for up to 14 days in the past.
        Data availability is dependent on machine support and commercial subscription.
      operationId: getTimeseriesSwitchStatus
      parameters:
      - $ref: '#/components/parameters/X-Cat-API-Tracking-Id'
      - $ref: '#/components/parameters/make'
      - $ref: '#/components/parameters/model'
      - $ref: '#/components/parameters/serialNumber'
      - $ref: '#/components/parameters/startDateUTC'
      - $ref: '#/components/parameters/endDateUTC'
      - $ref: '#/components/parameters/pageNumber'
      responses:
        '200':
          $ref: '#/components/responses/GetTimeSeriesSwitchStatusResponse'
        '400':
          $ref: '#/components/responses/400BadRequest'
        '401':
          $ref: '#/components/responses/401Unauthorized'
        '403':
          $ref: '#/components/responses/403Forbidden'
        '404':
          $ref: '#/components/responses/404NotFound'
        '406':
          $ref: '#/components/responses/406RequestNotAcceptable'
        '412':
          $ref: '#/components/responses/412PreconditionedFailed'
        '429':
          $ref: '#/components/responses/429TooManyRequests'
        '500':
          $ref: '#/components/responses/500InternalServerError'
        '503':
          $ref: '#/components/responses/503ServiceUnavailable'
  /fleet/equipment/makeModelSerial/{make}/{model}/{serialNumber}/locations/{startDateUTC}/{endDateUTC}/{pageNumber}:
    get:
      tags:
      - Time Series
      x-cat-confidential-level-data: 'Caterpillar: Confidential Yellow'
