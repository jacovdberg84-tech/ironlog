  /fleet/equipment/makeModelSerial/{make}/{model}/{serialNumber}/fuelRemainingRatio/{startDateUTC}/{endDateUTC}/{pageNumber}:
    get:
      tags:
      - Time Series
      x-cat-confidential-level-data: 'Caterpillar: Confidential Yellow'
      x-cat-entitlements-enforced: true
      summary: Get Asset FuelRemaining
      description: |
        Endpoint returns the fuel remaining ratio details in addition to the recorded time(UTC) of a
        given asset and the time range. The data can be requested for up to 14 days in the past.
        Data availability is dependent on machine support and commercial subscription.
      operationId: getTimeseriesFuelRemaingRatio
      parameters:
      - $ref: '#/components/parameters/X-Cat-API-Tracking-Id'
      - $ref: '#/components/parameters/make'
      - $ref: '#/components/parameters/model'
      - $ref: '#/components/parameters/serialNumber'
      - $ref: '#/components/parameters/startDateUTC'
      - $ref: '#/components/parameters/endDateUTC'
