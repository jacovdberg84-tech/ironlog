    Location:
      type: object
      required:
      - Latitude
      - Longitude
      - Altitude
      - AltitudeUnits
      - ChinaCoordinateId
      - datetime
      description: Changes in Latitude, Longitude and Altitude.
      properties:
        Latitude:
          maximum: 90
          minimum: -90
          type: number
          description: Latitude of location.
          format: double
          example: 40.69223
        Longitude:
          maximum: 180
          minimum: -180
          type: number
          description: Longitude of location.
          format: double
          example: -89.58893
        Altitude:
          type: number
          description: Altitude of location.
          format: double
          example: 42.007
        AltitudeUnits:
          type: string
          description: Units of Altitude.
          example: metre
        ChinaCoordinateId:
          type: number
          description: China Coordinate ID(s).
          format: double
          example: 499478202
