    ApiTrackingId:
      type: string
      description: A unique ID generated for each request or response.
      format: uuid
      example: 33aa372a-a4e4-11ea-bb37-0242ac130002
    Error:
      type: object
      required:
      - code
      - description
      description: |
        'Represents an error code, description, and detailed error message for a given endpoint. 
        Every HTTP status code returns a different `code` value in the response based on the
        nature of the error that occurred. One HTTP status code can return different `code`
        for different use cases'.
      properties:
        code:
          type: string
          description: Error Code represents an alpha-numeric error code received
            from the error.
          example: '404.001'
        description:
          type: string
          description: Message represents a textual description of a given error code.
          example: Resource Not Found
  parameters:
    X-Cat-API-Tracking-Id:
      name: X-Cat-API-Tracking-Id
      in: header
      description: A unique ID generated for each request.
      required: false
      schema:
        $ref: '#/components/schemas/ApiTrackingId'
    pageNumber:
      name: pageNumber
      in: path
      description: Any endpoints that return more than one piece of equipment or list
        of telematics data shall be paged.
      required: true
      schema:
        type: integer
      example: 2
    make:
      name: make
      in: path
      description: Alphabetic string representing the OEM of a specific piece of equipment.
      required: true
      schema:
        type: string
      example: CAT
    model:
      name: model
      in: path
      description: |
        Alphanumeric string representing the machine form type and series
        as defined by the OEM, In case of Model is unknown 'null' should be passed.
      required: true
      schema:
        type: string
      example: 924K
    serialNumber:
      name: serialNumber
      in: path
      description: |
        Alphanumeric string defined by the OEM identifying a specific piece
        of equipment. The serial number is generally PIN as defined in ISO 10261.
      required: true
      schema:
        type: string
      example: LEV24571
    startDateUTC:
      name: startDateUTC
      in: path
      description: |
        StartDate range of the API call. It must be in ISO 8601 format yyyy-MM-ddTHH:mm:ssZ.
      required: true
      schema:
        $ref: '#/components/schemas/DateTime'
    endDateUTC:
      name: endDateUTC
      in: path
      description: |
        EndDate range of the API call. It must be in ISO 8601 format yyyy-MM-ddTHH:mm:ssZ.
      required: true
      schema:
        $ref: '#/components/schemas/DateTime'
