components:
  headers:
    X-Cat-API-Tracking-Id:
      description: A unique ID generated for each response.
      required: false
      schema:
        $ref: '#/components/schemas/ApiTrackingId'
  schemas:
    FleetJson:
      description: The response object of the fleet endpoint.
      type: object
      properties:
        Links:
          type: array
          description: List of various link information for different pages.
          items:
            anyOf:
            - $ref: '#/components/schemas/CurrentLinkJson'
            - $ref: '#/components/schemas/NextLinkJson'
            - $ref: '#/components/schemas/PreviousLinkJson'
            - $ref: '#/components/schemas/FirstLinkJson'
            - $ref: '#/components/schemas/LastLinkJson'
        Equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
        Version:
          type: string
          description: Version number of the snapshot API.
          example: '1'
        SnapshotTime:
          $ref: '#/components/schemas/DateTime'
    Fleet:
      type: object
      description: Telemetry data for list of assets.
      properties:
        Links:
          type: array
          description: List of various link information for different pages.
          items:
            anyOf:
            - $ref: '#/components/schemas/CurrentLinkXml'
            - $ref: '#/components/schemas/NextLinkXml'
            - $ref: '#/components/schemas/PreviousLinkXml'
            - $ref: '#/components/schemas/FirstLinkXml'
            - $ref: '#/components/schemas/LastLinkXml'
        Equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
        version:
          type: string
          description: Version number of the snapshot API.
          xml:
            attribute: true
          example: '1'
        snapshotTime:
          $ref: '#/components/schemas/DateTime'
      xml:
        namespace: http://standards.iso.org/iso/15143/-3
    EquipmentXml:
      type: object
      description: Telemetry data for list of assets.
      properties:
        Links:
          type: array
          description: List of various link information for different pages.
          items:
            $ref: '#/components/schemas/EquipmentLinkXml'
        Equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
        version:
          type: string
          description: Version number of the snapshot API.
          xml:
            attribute: true
          example: '1'
        snapshotTime:
          $ref: '#/components/schemas/DateTime'
      xml:
        namespace: http://standards.iso.org/iso/15143/-3
    EquipmentJson:
      type: object
      description: The response object of Equipment endpoint.
      properties:
        Links:
          type: array
          description: List of various link information for different pages.
          items:
            anyOf:
            - $ref: '#/components/schemas/EquipmentLinkJson'
        Equipment:
          type: array
          items:
            $ref: '#/components/schemas/Equipment'
        Version:
          type: string
          description: Version number of the snapshot API.
          example: '1'
        SnapshotTime:
          $ref: '#/components/schemas/DateTime'
    FuelUsedLast24:
      description: Cumulative fuel used in last 24 hours.
      type: object
      properties:
        FuelConsumed:
          type: number
          description: Cumulative fuel used in last 24 hours.
          format: integer
          example: 600
        datetime:
          $ref: '#/components/schemas/DateTime'
        FuelUnits:
          type: string
          description: Unit of measure of fuel.
          example: litre
    Distance:
      description: Cumulative distance travelled.
      type: object
      properties:
        Odometer:
          type: number
          description: Cumulative distance travelled.
          format: double
          example: 746.9
        datetime:
          $ref: '#/components/schemas/DateTime'
        OdometerUnits:
          type: string
          description: Unit of measure of distance.
          example: kilometre
    CumulativeIdleHours:
      $ref: '#/components/schemas/CumulativeOperatingHours'
    FuelRemaining:
      description: Fuel remaining ratio.
      type: object
      properties:
        Percent:
          type: number
          description: Fuel remaining ratio.
          format: double
          example: 72.1
        datetime:
          $ref: '#/components/schemas/DateTime'
    DefRemaining:
      description: DEF remaining ratio.
      type: object
      properties:
        Percent:
          type: number
          description: DEF remaining ratio.
          format: double
          example: 74
        datetime:
          $ref: '#/components/schemas/DateTime'
    CumulativeLoadCount:
      description: Cumulative load count.
      type: object
      properties:
        Count:
          type: number
          description: Cumulative load count.
          format: integer
          example: 600
        datetime:
          $ref: '#/components/schemas/DateTime'
    CumulativePayloadTotals:
      description: Cumulative payload total.
      type: object
      properties:
        PayloadUnits:
          type: string
          description: Unit of measure of payload.
          example: Kilogram
        Payload:
          type: number
          description: Cumulative payload total.
          format: double
          example: 200
        datetime:
          $ref: '#/components/schemas/DateTime'
    FaultCodesResponse:
      type: object
      description: The response object for fault code endpoint.
      properties:
        Links:
          type: array
          description: List of various link information for different pages.
          items:
            $ref: '#/components/schemas/CurrentLinkFaultsJson'
        FaultCode:
          type: array
          description: List of Fault Code information reported for different datetime.
          items:
            $ref: '#/components/schemas/FaultCode'
      xml:
        namespace: http://standards.iso.org/iso/15143/-3
    FaultCode:
      type: object
      description: The fault code details for each asset.
      properties:
        CodeIdentifier:
          type: string
          description: Fault Code Identifier.
          example: 2114-3
        CodeDescription:
          type: string
          description: Fault Code description.
          example: Blade Control Handle Trigger Switch:Voltage Above Normal
        CodeSeverity:
          type: string
          description: Fault Code severity.
          example: Medium
        AirTemperature:
          type: integer
          description: Fault Code Air Temperature.
          example: 6
        TemperatureUnit:
          type: string
          description: Fault Code Temperature Unit.
          example: Celsius
        CodeSource:
          type: string
          description: Fault Code source.
          example: TTT Trans
        datetime:
          $ref: '#/components/schemas/DateTime'
    Equipment:
      type: object
      description: Various telemetry data for each asset.
      properties:
        EquipmentHeader:
          $ref: '#/components/schemas/EquipmentHeader'
        Location:
          $ref: '#/components/schemas/Location'
        CumulativeOperatingHours:
          $ref: '#/components/schemas/CumulativeOperatingHours'
        FuelUsed:
          $ref: '#/components/schemas/FuelUsed'
        FuelUsedLast24:
          $ref: '#/components/schemas/FuelUsedLast24'
        Distance:
          $ref: '#/components/schemas/Distance'
        CumulativeIdleHours:
          $ref: '#/components/schemas/CumulativeOperatingHours'
        FuelRemaining:
          $ref: '#/components/schemas/FuelRemaining'
        DEFRemaining:
          $ref: '#/components/schemas/DefRemaining'
        EngineStatus:
          $ref: '#/components/schemas/EngineStatus'
        CumulativeLoadCount:
          $ref: '#/components/schemas/CumulativeLoadCount'
        CumulativePayloadTotals:
          $ref: '#/components/schemas/CumulativePayloadTotals'
    EquipmentHeader:
      type: object
      properties:
        OEMName:
          type: string
          description: Original Equipment Manufacturers Name.
          example: CAT
        Model:
          type: string
          description: Equipment Model.
          example: 924K
        EquipmentID:
          type: string
          description: Equipment ID.
          example: HU-HH-ZH
        SerialNumber:
          maxLength: 17
          minLength: 1
          type: string
          description: Serial Number.
          example: MEJ00000
      description: Equipment header information.
    EquipmentLinkJson:
      description: Json response object for Pagination reference.
      type: object
      properties:
        Rel:
          $ref: '#/components/schemas/Rel'
        Href:
          allOf:
          - $ref: '#/components/schemas/Href'
          example: https://api.cat.com/telematics/iso15143/fleet/equipment/makeModelSerial/CAT/null/MEJ00000
    EquipmentLinkXml:
      type: object
      description: XML response object for Pagination reference.
      properties:
        rel:
          $ref: '#/components/schemas/Rel'
        href:
          allOf:
